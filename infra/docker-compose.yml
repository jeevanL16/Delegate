version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: delegate
      POSTGRES_PASSWORD: delegate
      POSTGRES_DB: delegate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegate -d delegate"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://delegate:delegate@postgres:5432/delegate
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    image: python:3.11-slim
    working_dir: /app
    env_file: ../.env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ../:/app:ro
    command: >
      bash -c "pip install streamlit requests python-jose -q &&
               streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api

volumes:
  postgres_data:
