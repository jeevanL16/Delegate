name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: delegate
          POSTGRES_PASSWORD: delegate
          POSTGRES_DB: delegate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: sqlite:///./test_ci.db
      ANTHROPIC_API_KEY: test-key-ci
      SERVICE_API_KEY: test-service-key-ci
      HUMAN_JWT_SECRET: test-jwt-secret-ci
      CLAUDE_MODEL: claude-sonnet-4-6
      REFUND_CAP_PAISE: 1000000
      MAX_TOOL_CALLS_PER_TICKET: 5
      MAX_REFUNDS_PER_TICKET: 1
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run golden ticket tests
        run: pytest tests/golden/ -v --tb=short

      - name: Run red-team injection tests
        run: pytest tests/red_team/ -v --tb=short
        # This suite BLOCKS merge on failure — 0 unauthorized actions required

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Full test summary
        run: pytest tests/ -v --tb=short --co -q
        if: always()
